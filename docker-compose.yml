name: daredevil

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=4GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c max_connections=100
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c synchronous_commit=off
    environment:
      - POSTGRES_DB=daredevil
      - POSTGRES_USER=daredevil
      - POSTGRES_PASSWORD=${DB_PASSWORD:-daredevil}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    # Checked over TCP: on the very first start Postgres runs a temporary
    # setup server that only listens on its Unix socket, so a socket check
    # passes before anything on the network can connect (db-init then got
    # "connection refused" on a slow disk).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U daredevil -d daredevil"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ── Databases for Sonarr / Radarr / Prowlarr ───────────────────────────────
  # One-shot: creates each app's main and log database in the Postgres above
  # if they don't exist yet, then exits. The apps start after it's done.
  db-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGHOST=db
      - PGUSER=daredevil
      - PGPASSWORD=${DB_PASSWORD:-daredevil}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Retry for up to 2 minutes rather than failing on the first refusal
        tries=0
        until pg_isready -q; do
          tries=$$((tries + 1)); [ $$tries -ge 60 ] && echo "Postgres never came up" && exit 1
          sleep 2
        done
        for name in sonarr-main sonarr-log radarr-main radarr-log prowlarr-main prowlarr-log; do
          psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$$name'" | grep -q 1 \
            || psql -d postgres -c "CREATE DATABASE \"$$name\"" || exit 1
        done

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - ${DATA_DIR:-./data}/redis:/data

  # ── qBittorrent ────────────────────────────────────────────────────────────
  # Web UI: http://<host>:${QBT_WEBUI_PORT:-8081}   (default 8081 — Unraid uses 8080)
  # First run: check logs for the temporary password → docker compose logs qbittorrent
  # Skip this service if you already have qBittorrent installed on Unraid via Community Apps.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
    ports:
      - "${QBT_WEBUI_PORT:-8081}:8080"  # Changed default to 8081 — Unraid WebUI is on 8080
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ${DATA_DIR:-./data}/qbt:/config
      - ${DOWNLOADS_DIR:-./downloads}:/downloads

  # ── Prowlarr ───────────────────────────────────────────────────────────────
  # Web UI: http://<host>:${PROWLARR_PORT:-9696}
  # Indexer manager — replaces Jackett. Indexers are added once here (or from
  # Daredevil's Settings → Prowlarr tab) and Prowlarr pushes them to Sonarr
  # and Radarr automatically. Daredevil's Search page queries it directly.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      # Settings live in Postgres (the db service) rather than a SQLite file in /config
      - PROWLARR__POSTGRES__HOST=db
      - PROWLARR__POSTGRES__PORT=5432
      - PROWLARR__POSTGRES__USER=daredevil
      - PROWLARR__POSTGRES__PASSWORD=${DB_PASSWORD:-daredevil}
      - PROWLARR__POSTGRES__MAINDB=prowlarr-main
      - PROWLARR__POSTGRES__LOGDB=prowlarr-log
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    volumes:
      - ${DATA_DIR:-./data}/prowlarr:/config
      # Waits for Postgres before the app starts (see the script)
      - ./scripts/arr-init:/custom-cont-init.d:ro

  # ── FlareSolverr ───────────────────────────────────────────────────────────
  # Gets Prowlarr past Cloudflare's "checking your browser" page on indexers
  # that have one: Prowlarr sends their requests through it (an indexer
  # proxy, connected from Settings → Prowlarr → FlareSolverr). Only the other
  # containers talk to it, so no port is published.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-UTC}

  # ── Sonarr ─────────────────────────────────────────────────────────────────
  # Web UI: http://<host>:${SONARR_PORT:-8989}
  # Owns the TV library: monitoring, searching, grabbing (via qBittorrent)
  # and importing finished downloads into TV_DIR. Daredevil is the front end.
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    # Plex runs with network_mode: host — this lets the "Refresh Plex" connection
    # reach it at host.docker.internal on Linux/Unraid too (built in on Docker Desktop)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      # Settings live in Postgres (the db service) rather than a SQLite file in /config
      - SONARR__POSTGRES__HOST=db
      - SONARR__POSTGRES__PORT=5432
      - SONARR__POSTGRES__USER=daredevil
      - SONARR__POSTGRES__PASSWORD=${DB_PASSWORD:-daredevil}
      - SONARR__POSTGRES__MAINDB=sonarr-main
      - SONARR__POSTGRES__LOGDB=sonarr-log
    ports:
      - "${SONARR_PORT:-8989}:8989"
    volumes:
      - ${DATA_DIR:-./data}/sonarr:/config
      # Waits for Postgres before the app starts (see the script)
      - ./scripts/arr-init:/custom-cont-init.d:ro
      # /downloads matches qbittorrent's own container path, so the paths
      # qBittorrent reports for finished torrents resolve inside this
      # container as-is — no remote path mapping needed.
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
      - ${TV_DIR:-./tv}:/tv

  # ── Radarr ─────────────────────────────────────────────────────────────────
  # Web UI: http://<host>:${RADARR_PORT:-7878}
  # Same role as Sonarr, for movies — imports into MOVIES_DIR.
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    # Plex runs with network_mode: host — this lets the "Refresh Plex" connection
    # reach it at host.docker.internal on Linux/Unraid too (built in on Docker Desktop)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      # Settings live in Postgres (the db service) rather than a SQLite file in /config
      - RADARR__POSTGRES__HOST=db
      - RADARR__POSTGRES__PORT=5432
      - RADARR__POSTGRES__USER=daredevil
      - RADARR__POSTGRES__PASSWORD=${DB_PASSWORD:-daredevil}
      - RADARR__POSTGRES__MAINDB=radarr-main
      - RADARR__POSTGRES__LOGDB=radarr-log
    ports:
      - "${RADARR_PORT:-7878}:7878"
    volumes:
      - ${DATA_DIR:-./data}/radarr:/config
      # Waits for Postgres before the app starts (see the script)
      - ./scripts/arr-init:/custom-cont-init.d:ro
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
      - ${MOVIES_DIR:-./movies}:/movies

  # ── Plex Media Server ──────────────────────────────────────────────────────
  # Web UI: http://<host>:32400/web
  # Skip this service if Plex is already installed on Unraid via Community Apps —
  # just point PLEX_URL in .env at your existing Plex container (e.g. http://plex:32400).
  plex:
    image: lscr.io/linuxserver/plex:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - ${DATA_DIR:-./data}/plex:/config
      - ${MOVIES_DIR:-./movies}:/data/movies
      - ${TV_DIR:-./tv}:/data/tv

  # ── Cloudflare Tunnel ──────────────────────────────────────────────────────
  # Exposes `web` publicly with zero inbound ports — cloudflared connects
  # outbound to Cloudflare's edge only, doesn't affect any other service.
  # Requires CLOUDFLARE_TUNNEL_TOKEN in .env (see README) — without it this
  # container will crash-loop uselessly, so comment this block out entirely
  # rather than leaving the token blank if you're not using the tunnel yet.
  # Get the token from the Cloudflare Zero Trust dashboard: Networks ->
  # Tunnels -> Create a tunnel -> Docker connector.
  cloudflared:
    # Pinned rather than :latest — `up -d` never re-pulls a tag it already
    # has, so a cached :latest stays on whatever version was first pulled.
    # Keep it at 2026.10.3 or later: older versions trust the compromised
    # eMudhra (emSign) certificates (Cloudflare advisory, Oct 2026).
    image: cloudflare/cloudflared:2026.10.4
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_started

  # ── Daredevil web server ───────────────────────────────────────────────────
  web:
    build: .
    image: daredevil-app
    # Built here, never on Docker Hub — tells `docker compose pull` (and
    # Unraid's "Update Stack") to skip it instead of failing with "pull
    # access denied for daredevil-app"
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DAREDEVIL_ENV_FILE=/srv/daredevil/.env
      - QBITTORRENT_HOST=qbittorrent
      - QBITTORRENT_PORT=8080
      - DB_HOST=db
      - DB_NAME=daredevil
      - DB_USER=daredevil
      - DB_PASSWORD=${DB_PASSWORD:-daredevil}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qbittorrent:
        condition: service_started
    volumes:
      # The folder, not the file: a single-file mount pins the original copy,
      # so an editor that saves by replacing .env (e.g. sed -i) left the app
      # with "Stale file handle" until it was recreated
      - .:/srv/daredevil
      - ${DOWNLOADS_DIR:-./downloads}:/media/downloads
      - ${MOVIES_DIR:-./movies}:/media/movies
      - ${TV_DIR:-./tv}:/media/tv
      # Unraid's live drive list (disks.ini), so Storage shows the array and
      # every pool — set UNRAID_STATUS_DIR=/var/local/emhttp in .env on Unraid
      - ${UNRAID_STATUS_DIR:-./data/unraid}:/unraid:ro

  # ── Celery worker ──────────────────────────────────────────────────────────
  worker:
    image: daredevil-app
    pull_policy: never  # uses the image web builds
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency 6
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DAREDEVIL_ENV_FILE=/srv/daredevil/.env
      - QBITTORRENT_HOST=qbittorrent
      - QBITTORRENT_PORT=8080
      - DB_HOST=db
      - DB_NAME=daredevil
      - DB_USER=daredevil
      - DB_PASSWORD=${DB_PASSWORD:-daredevil}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qbittorrent:
        condition: service_started
    volumes:
      # The folder, not the file: a single-file mount pins the original copy,
      # so an editor that saves by replacing .env (e.g. sed -i) left the app
      # with "Stale file handle" until it was recreated
      - .:/srv/daredevil
      - ${DOWNLOADS_DIR:-./downloads}:/media/downloads
      - ${MOVIES_DIR:-./movies}:/media/movies
      - ${TV_DIR:-./tv}:/media/tv
      # Unraid's live drive list (disks.ini), so Storage shows the array and
      # every pool — set UNRAID_STATUS_DIR=/var/local/emhttp in .env on Unraid
      - ${UNRAID_STATUS_DIR:-./data/unraid}:/unraid:ro

  # ── Celery beat scheduler ──────────────────────────────────────────────────
  beat:
    image: daredevil-app
    pull_policy: never  # uses the image web builds
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DAREDEVIL_ENV_FILE=/srv/daredevil/.env
      - DB_HOST=db
      - DB_NAME=daredevil
      - DB_USER=daredevil
      - DB_PASSWORD=${DB_PASSWORD:-daredevil}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # The folder, not the file: a single-file mount pins the original copy,
      # so an editor that saves by replacing .env (e.g. sed -i) left the app
      # with "Stale file handle" until it was recreated
      - .:/srv/daredevil
