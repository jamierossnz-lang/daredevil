{% extends "base.html" %}
{% block title %}{{ app }} unavailable{% endblock %}
{% block page_title %}{{ app }} unavailable{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto glass rounded-2xl p-8 text-center mt-8 border border-red-500/20">
  <i class="fa-solid fa-plug-circle-exclamation text-4xl text-red-400 mb-4 block"></i>
  <h2 class="text-lg font-semibold text-white mb-2">Couldn't reach {{ app }}</h2>
  <p class="text-sm text-red-300/80 mb-6 break-words">{{ error }}</p>
  <div class="flex justify-center gap-2">
    <button onclick="location.reload()" class="px-4 py-2 bg-surface-700 hover:bg-surface-600 text-gray-200 rounded-xl text-sm font-medium transition-colors">
      <i class="fa-solid fa-rotate-right mr-1.5"></i>Retry
    </button>
    <a href="{% url 'app_settings' %}#{{ app|lower }}" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-medium transition-colors">
      <i class="fa-solid fa-gear mr-1.5"></i>Check connection
    </a>
  </div>
</div>
{% endblock %}
