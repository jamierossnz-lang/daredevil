{% extends "base.html" %}
{% block title %}For You{% endblock %}
{% block page_title %}For You{% endblock %}

{% block header_actions %}
<a href="{% url 'app_settings' %}#foryou" title="For You settings" aria-label="For You settings"
   class="w-10 h-10 sm:w-9 sm:h-9 rounded-xl flex items-center justify-center text-gray-400 hover:text-gray-200 hover:bg-surface-700 transition-colors">
  <i class="fa-solid fa-sliders"></i>
</a>
{% endblock %}

{% block content %}
<div x-data="swipeDeck()" class="max-w-md mx-auto">

  <!-- Header -->
  <div class="flex items-center justify-between mb-4 px-1">
    <p class="text-xs text-gray-500">
      <span x-show="!loading" x-text="`${remaining} pick${remaining === 1 ? '' : 's'} waiting`"></span>
      <span x-show="loading">Loading picks…</span>
    </p>
    <p class="text-xs text-gray-600"><i class="fa-solid fa-wand-magic-sparkles mr-1 text-brand-400"></i>Personalised nightly</p>
  </div>

  <!-- Card stack -->
  <div class="relative w-full" style="height:min(64vh, 580px);">

    <template x-if="loading">
      <div class="absolute inset-0 rounded-3xl bg-surface-800 border border-surface-700/50 flex items-center justify-center">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-brand-400"></i>
      </div>
    </template>

    <template x-if="!loading && !current">
      <div class="absolute inset-0 rounded-3xl border-2 border-dashed border-surface-700 flex flex-col items-center justify-center text-center px-8">
        <i class="fa-solid fa-champagne-glasses text-4xl text-brand-400 mb-3"></i>
        <p class="text-white font-semibold mb-1">You're all caught up</p>
        <p class="text-sm text-gray-500">New picks are made overnight from your library and what's buzzing — check back tomorrow, or
          <a href="{% url 'app_settings' %}#foryou" class="text-brand-400 hover:underline">rebuild the deck now</a>.</p>
      </div>
    </template>

    <!-- peek: 2 back -->
    <template x-if="next2">
      <div class="absolute inset-0 rounded-3xl overflow-hidden shadow-xl bg-surface-800"
           :style="`transform:scale(0.92) translateY(20px); opacity:0.5; background-image:url('${next2.backdrop_url || next2.poster_url || ''}'); background-size:cover; background-position:center;`">
      </div>
    </template>

    <!-- peek: 1 back -->
    <template x-if="next1">
      <div class="absolute inset-0 rounded-3xl overflow-hidden shadow-xl bg-surface-800"
           :style="`transform:scale(0.96) translateY(10px); opacity:0.8; background-image:url('${next1.backdrop_url || next1.poster_url || ''}'); background-size:cover; background-position:center;`">
      </div>
    </template>

    <!-- top card, draggable -->
    <template x-if="current">
      <div class="absolute inset-0 rounded-3xl overflow-hidden shadow-2xl bg-surface-800 cursor-grab active:cursor-grabbing select-none touch-none"
           :style="`${cardStyle()} background-image:url('${current.backdrop_url || current.poster_url || ''}'); background-size:cover; background-position:center;`"
           @pointerdown="onPointerDown($event)"
           @pointermove="onPointerMove($event)"
           @pointerup="onPointerUp($event)"
           @pointercancel="onPointerUp($event)">

        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-black/10"></div>

        <div class="absolute top-8 left-6 border-4 rounded-xl px-3 py-1 font-black text-xl tracking-widest uppercase"
             style="border-color:#22c55e; color:#22c55e;"
             :style="`opacity:${likeOpacity()}; transform: rotate(-16deg) scale(${0.85 + likeOpacity()*0.15});`">
          Like
        </div>
        <div class="absolute top-8 right-6 border-4 rounded-xl px-3 py-1 font-black text-xl tracking-widest uppercase"
             style="border-color:#f43f5e; color:#f43f5e;"
             :style="`opacity:${nopeOpacity()}; transform: rotate(16deg) scale(${0.85 + nopeOpacity()*0.15});`">
          Nope
        </div>

        <div class="absolute bottom-0 inset-x-0 p-5">
          <div class="flex items-center gap-2 mb-2 flex-wrap">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-brand-600/80 text-white"
                  x-text="current.media_type === 'movie' ? 'Movie' : 'TV Show'"></span>
            <span x-show="current.source === 'anticipated'" class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-black/50 text-gray-200"
                  x-text="current.source_title || 'New & Anticipated'"></span>
            <span x-show="current.source !== 'anticipated' && current.because.length > 1"
                  class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/80 text-black"
                  x-text="`Matches ${current.because.length} of yours`"></span>
            <span x-show="!current.is_released" class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-500/80 text-black">
              Coming <span x-text="current.release_date ? current.release_date.slice(0,4) : 'soon'"></span>
            </span>
            <button @pointerdown.stop @click.stop="openTrailer()"
                    class="ml-auto px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-white/15 hover:bg-white/25 text-white flex items-center gap-1.5 transition-colors">
              <i class="fa-solid fa-play text-[8px]"></i> Trailer
            </button>
          </div>
          <h2 class="text-2xl font-bold text-white leading-tight mb-1" x-text="current.title"></h2>
          <p x-show="current.source !== 'anticipated' && current.because.length" class="text-xs text-gray-200 mb-1.5 line-clamp-2">
            <i class="fa-solid fa-heart text-emerald-400 mr-1"></i>Because you like <span class="font-semibold text-white" x-text="becauseText(current)"></span>
          </p>
          <div class="flex items-center gap-3 text-xs text-gray-300 mb-2">
            <span x-show="current.release_date"><i class="fa-solid fa-calendar mr-1"></i><span x-text="(current.release_date || '').slice(0,4)"></span></span>
            <span x-show="current.vote_average"><i class="fa-solid fa-star text-amber-400 mr-1"></i><span x-text="current.vote_average"></span></span>
            <span x-show="current.genres && current.genres.length" class="truncate" x-text="(current.genres || []).join(' · ')"></span>
          </div>
          <p class="text-xs text-gray-300 leading-relaxed line-clamp-3" x-text="current.overview"></p>
        </div>
      </div>
    </template>
  </div>

  <!-- Controls -->
  <div class="flex items-center justify-center gap-8 mt-6">
    <button @click="swipeLeft()" :disabled="busy || !current"
            class="w-16 h-16 rounded-full bg-surface-800 border border-surface-600 text-rose-400 text-2xl flex items-center justify-center shadow-lg active:scale-90 transition-transform disabled:opacity-30">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <button @click="swipeRight()" :disabled="busy || !current"
            class="w-16 h-16 rounded-full bg-surface-800 border border-surface-600 text-emerald-400 text-2xl flex items-center justify-center shadow-lg active:scale-90 transition-transform disabled:opacity-30">
      <i class="fa-solid fa-heart"></i>
    </button>
  </div>

  <!-- Trailer -->
  <div x-show="showTrailer" x-cloak class="fixed inset-0 z-[60] flex items-center justify-center bg-black/90 p-4">
    <div class="absolute inset-0" @click="closeTrailer()"></div>
    <button @click="closeTrailer()"
            class="absolute top-5 right-5 w-10 h-10 rounded-full bg-surface-800 border border-surface-600 text-gray-300 hover:text-white flex items-center justify-center transition-colors"
            style="top: calc(1.25rem + env(safe-area-inset-top, 0px))">
      <i class="fa-solid fa-xmark text-lg"></i>
    </button>
    <div class="relative w-full max-w-lg" @click.stop>
      <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-surface-900">
        <template x-if="trailerLoading">
          <div class="absolute inset-0 flex items-center justify-center">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-brand-400"></i>
          </div>
        </template>
        <template x-if="!trailerLoading && trailerKey">
          {# YouTube refuses embeds without a Referer ("Error 153"), and Django's
             default Referrer-Policy (same-origin) strips it from cross-origin requests #}
          <iframe class="w-full h-full" :src="`https://www.youtube.com/embed/${trailerKey}?autoplay=1&playsinline=1`"
                  referrerpolicy="strict-origin-when-cross-origin"
                  frameborder="0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"></iframe>
        </template>
        <template x-if="!trailerLoading && !trailerKey">
          <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-6">
            <i class="fa-solid fa-video-slash text-3xl text-gray-500 mb-3"></i>
            <p class="text-gray-400 text-sm">No trailer available yet</p>
          </div>
        </template>
      </div>
      <a x-show="!trailerLoading && trailerKey" :href="`https://www.youtube.com/watch?v=${trailerKey}`" target="_blank" rel="noopener"
         class="mt-3 flex items-center justify-center gap-2 text-xs text-gray-400 hover:text-gray-200 transition-colors">
        <i class="fa-brands fa-youtube"></i> Having trouble? Watch on YouTube
      </a>
    </div>
  </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
const csrfToken = '{{ csrf_token }}';

function swipeDeck() {
  return {
    items: [],
    index: 0,
    loading: true,
    dragging: false,
    startX: 0, startY: 0,
    dragX: 0, dragY: 0,
    busy: false,
    showTrailer: false,
    trailerLoading: false,
    trailerKey: null,

    async init() {
      try {
        const res = await fetch('{% url "swipe_deck_data" %}');
        const data = await res.json();
        this.items = data.items || [];
      } catch (e) {
        console.error('For You: failed to load deck', e);
      }
      this.loading = false;
    },

    get current() { return this.items[this.index] || null; },
    get next1() { return this.items[this.index + 1] || null; },
    get next2() { return this.items[this.index + 2] || null; },
    get remaining() { return Math.max(this.items.length - this.index, 0); },

    becauseText(item) {
      const names = item.because || [];
      if (names.length <= 3) return names.length > 1 ? `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}` : (names[0] || '');
      return `${names.slice(0, 3).join(', ')} and ${names.length - 3} more`;
    },

    cardStyle() {
      const rot = this.dragX / 14;
      const transition = this.dragging ? '' : 'transition: transform 0.35s cubic-bezier(.2,.8,.2,1);';
      return `transform: translate(${this.dragX}px, ${this.dragY}px) rotate(${rot}deg); ${transition}`;
    },
    likeOpacity() { return Math.min(Math.max(this.dragX / 100, 0), 1); },
    nopeOpacity() { return Math.min(Math.max(-this.dragX / 100, 0), 1); },

    onPointerDown(e) {
      if (this.busy || !this.current) return;
      this.dragging = true;
      this.startX = e.clientX;
      this.startY = e.clientY;
      e.currentTarget.setPointerCapture(e.pointerId);
    },
    onPointerMove(e) {
      if (!this.dragging) return;
      this.dragX = e.clientX - this.startX;
      this.dragY = e.clientY - this.startY;
    },
    onPointerUp() {
      if (!this.dragging) return;
      this.dragging = false;
      const threshold = 110;
      if (this.dragX > threshold) this.swipeRight();
      else if (this.dragX < -threshold) this.swipeLeft();
      else { this.dragX = 0; this.dragY = 0; }
    },

    advance() {
      this.index++;
      this.dragX = 0;
      this.dragY = 0;
    },

    swipeLeft() {
      if (this.busy || !this.current) return;
      this.busy = true;
      const item = this.current;
      this.dragX = -700;
      this.dragY -= 30;
      setTimeout(async () => {
        this.advance();
        this.busy = false;
        try {
          await fetch(`/foryou/${item.id}/left/`, { method: 'POST', headers: { 'X-CSRFToken': csrfToken } });
        } catch (e) { console.error(e); }
      }, 280);
    },

    swipeRight() {
      // Same Add dialog as everywhere else. Cancelling it undoes the swipe.
      if (this.busy || !this.current) return;
      this.busy = true;
      const item = this.current;
      this.dragX = 700;
      this.dragY -= 30;
      setTimeout(() => {
        this.advance();
        this.busy = false;
        openAddModal({
          kind: item.media_type === 'movie' ? 'radarr' : 'sonarr', tmdbId: item.tmdb_id,
          title: item.title, year: (item.release_date || '').slice(0, 4), poster: item.poster_url,
          tags: ['for-you'],
          onAdded: () => this.keep(item),
          onCancel: () => this.items.splice(this.index, 0, item),
        });
      }, 280);
    },

    async keep(item) {
      try {
        await fetch(`/foryou/${item.id}/right/`, { method: 'POST', headers: { 'X-CSRFToken': csrfToken } });
      } catch (e) { console.error(e); }
    },

    async openTrailer() {
      if (!this.current) return;
      this.showTrailer = true;
      this.trailerLoading = true;
      this.trailerKey = null;
      try {
        const r = await fetch(`/foryou/${this.current.id}/trailer/`);
        const d = await r.json();
        this.trailerKey = d.key || null;
      } catch (e) {
        console.error(e);
      }
      this.trailerLoading = false;
    },

    closeTrailer() {
      this.showTrailer = false;
      this.trailerKey = null;
    },
  };
}
</script>
{% endblock %}
