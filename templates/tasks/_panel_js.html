<script>
var csrfToken = document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '{{ csrf_token }}';

function taskCard(taskName) {
  return {
    running: false,
    runStatus: null,
    runDuration: null,
    showError: false,
    taskId: null,
    startedAt: null,
    pollTimer: null,

    async run() {
      this.running = true;
      this.runStatus = 'PENDING';
      this.runDuration = null;
      this.startedAt = Date.now();
      const fd = new FormData();
      fd.append('task', taskName);
      try {
        const res = await fetch('/tasks/trigger/', {
          method: 'POST', body: fd, headers: { 'X-CSRFToken': csrfToken }
        });
        const data = await res.json();
        if (data.error) {
          this.runStatus = 'FAILURE';
          this.running = false;
          return;
        }
        this.taskId = data.task_id;
        this.pollTimer = setInterval(async () => {
          try {
            const r = await fetch(`/tasks/poll/${this.taskId}/`);
            const d = await r.json();
            this.runStatus = d.status;
            if (d.status !== 'PENDING' && d.status !== 'STARTED') {
              clearInterval(this.pollTimer);
              this.running = false;
              this.runDuration = ((Date.now() - this.startedAt) / 1000).toFixed(1);
              refreshHistory();
            }
          } catch(e) { clearInterval(this.pollTimer); this.running = false; }
        }, 1000);
      } catch(e) {
        this.runStatus = 'FAILURE';
        this.running = false;
      }
    },
  };
}

function scheduleRow(pk, initialEnabled, initialEvery, initialPeriod) {
  return {
    enabled: initialEnabled,
    editEvery: initialEvery || 1,
    editPeriod: initialPeriod || 'hours',
    currentSchedule: initialEvery ? `Every ${initialEvery} ${initialPeriod}` : 'Cron / custom',

    async toggle() {
      const res = await fetch(`/tasks/schedule/${pk}/toggle/`, {
        method: 'POST', headers: { 'X-CSRFToken': csrfToken }
      });
      const d = await res.json();
      this.enabled = d.enabled;
    },

    async save() {
      const res = await fetch(`/tasks/schedule/${pk}/update/`, {
        method: 'POST',
        headers: { 'X-CSRFToken': csrfToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({ every: this.editEvery, period: this.editPeriod }),
      });
      const d = await res.json();
      if (d.ok) this.currentSchedule = d.schedule;
    },

    async del() {
      if (!confirm('Delete this scheduled task?')) return;
      await fetch(`/tasks/schedule/${pk}/delete/`, {
        method: 'POST', headers: { 'X-CSRFToken': csrfToken }
      });
      document.getElementById(`schedule-${pk}`)?.remove();
    },
  };
}

async function refreshHistory() {
  const table = document.getElementById('historyTable');
  // Only while the panel is on screen (it lives in a Settings tab now)
  if (!table || !table.offsetParent) return;
  const icon = document.getElementById('refreshIcon');
  if (icon) icon.classList.add('fa-spin');
  try {
    const res = await fetch('/tasks/recent/');
    table.innerHTML = await res.text();
  } finally {
    if (icon) icon.classList.remove('fa-spin');
  }
}

setInterval(refreshHistory, 15000);
</script>
