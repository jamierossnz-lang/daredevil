{# One calendar entry in a list (Alpine scope: e) — tap for the event sheet #}
<button type="button" @click="selected = e" class="w-full flex items-center gap-3 px-3 sm:px-4 py-3 text-left hover:bg-white/[0.03] transition-colors"
        :class="e.status === 'unmonitored' ? 'opacity-60' : ''">
  <span class="relative flex-shrink-0">
    <img x-show="e.poster" :src="e.poster" alt="" loading="lazy" class="w-10 aspect-[2/3] rounded-lg object-cover bg-surface-700">
    <span x-show="!e.poster" class="w-10 aspect-[2/3] rounded-lg bg-surface-700 flex items-center justify-center">
      <i class="fa-solid text-gray-500" :class="e.kind === 'episode' ? 'fa-tv' : 'fa-film'"></i>
    </span>
    <span class="absolute -bottom-1 -right-1 w-3 h-3 rounded-full ring-2 ring-surface-900" :class="dotClass(e)"></span>
  </span>
  <span class="min-w-0 flex-1">
    <span class="block text-sm font-semibold text-gray-100 truncate" x-text="e.title"></span>
    <span class="block text-xs text-gray-400 truncate" x-text="e.subtitle"></span>
    <span class="block text-[11px] text-gray-500 mt-0.5" x-text="[e.time || 'All day', e.network].filter(Boolean).join(' · ')"></span>
  </span>
  <span class="flex-shrink-0 px-2 py-0.5 rounded-full text-[11px] font-semibold" :class="statusClass(e)" x-text="statusLabel(e)"></span>
</button>
